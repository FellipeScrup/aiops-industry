name: aiops-industry

services:

  # ── Bronze ─────────────────────────────────────────────────────────────────
  # MinIO: data lake S3-compatible (buckets bronze / silver / gold)
  minio:
    image: minio/minio:latest
    container_name: aiops-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - aiops-net
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # Job one-shot: cria os buckets necessários no MinIO e encerra
  minio-init:
    image: minio/mc:latest
    container_name: aiops-minio-init
    restart: "no"
    networks:
      - aiops-net
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD
        mc mb --ignore-existing local/bronze
        mc mb --ignore-existing local/silver
        mc mb --ignore-existing local/gold
        echo "Estrutura Medallion pronta:"
        echo "  s3://bronze/   — dados brutos (NDJSON, BPMN)"
        echo "  s3://silver/   — dados normalizados (Parquet)"
        echo "  s3://gold/     — features ML + metadata Milvus"

  # ── Silver ─────────────────────────────────────────────────────────────────
  # PostgreSQL: dados relacionais, logs normalizados
  postgres:
    image: postgres:16
    container_name: aiops-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - aiops-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Adminer: UI web para inspecionar o PostgreSQL
  adminer:
    image: adminer:latest
    container_name: aiops-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    networks:
      - aiops-net
    depends_on:
      postgres:
        condition: service_healthy

  # ── Gold ────────────────────────────────────────────────────────────────────
  # etcd: dependência do Milvus (coordenação de metadados)
  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    container_name: aiops-etcd
    restart: unless-stopped
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    volumes:
      - milvus_etcd:/etcd
    networks:
      - aiops-net
    command: >
      etcd
      -advertise-client-urls=http://etcd:2379
      -listen-client-urls=http://0.0.0.0:2379
      --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 10s

  # MinIO dedicado para o Milvus (não compartilhar com a camada Bronze)
  milvus-minio:
    image: minio/minio:RELEASE.2023-03-13T19-46-17Z
    container_name: aiops-milvus-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - milvus_minio:/minio_data
    networks:
      - aiops-net
    command: server /minio_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 15s

  # ── LLM ───────────────────────────────────────────────────────────────────
  # Ollama: inferência local de LLMs (geração das respostas do RAG)
  #
  # Suporte a GPU:
  #   - HOST com NVIDIA (Fedora/Ubuntu com nvidia-container-toolkit instalado):
  #     o bloco `deploy.resources` abaixo passa a GPU para o container automaticamente.
  #   - HOST com AMD/Intel/sem GPU: comente o bloco `deploy:` E use o Ollama nativo
  #     do SO (Windows/macOS/Linux). Pare este serviço com `docker compose stop ollama`
  #     antes de subir o Ollama nativo, para evitar conflito na porta 11434.
  ollama:
    image: ollama/ollama:latest
    container_name: aiops-ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    networks:
      - aiops-net
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # Milvus Standalone: banco vetorial (embeddings 768d via nomic-embed-text)
  milvus:
    image: milvusdb/milvus:v2.4.15
    container_name: aiops-milvus
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: milvus-minio:9000
    volumes:
      - milvus_data:/var/lib/milvus
    ports:
      - "19530:19530"
      - "9091:9091"
    networks:
      - aiops-net
    depends_on:
      etcd:
        condition: service_healthy
      milvus-minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 90s


volumes:
  postgres_data:
  minio_data:
  milvus_etcd:
  milvus_minio:
  milvus_data:
  ollama_data:

networks:
  aiops-net:
    driver: bridge
